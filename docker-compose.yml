services:
  ilubot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ilubot:latest
    container_name: ilubot
    ports:
      - "${ILUBOT_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Conversation sessions + history. Keys expire after SESSION_TTL_SECONDS idle.
  # Not published to the host: only the ilubot container can reach it.
  redis:
    image: redis:7-alpine
    container_name: ilubot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
