services:
  ilubot-conference:
    build:
      context: .
      dockerfile: Dockerfile
    image: ilubot-conference:latest
    container_name: ilubot-conference
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
